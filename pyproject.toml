[project]
name = "transcript-mcp"
version = "0.0.1"
description = "Transcribe and search your videos and lectures locally, as an MCP server"
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Matvii Lysytskyi" }]
requires-python = ">=3.11"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
transcript-mcp = "transcript_mcp.server:main"

[project.urls]
Repository = "https://github.com/Dostanhalat/transcript-mcp"

[dependency-groups]
dev = ["pytest>=9", "ruff>=0.17"]

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
